<section class="category-form">
  <h1>{{ isEditMode() ? 'Edit Category' : 'New Category' }}</h1>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Name
      <input type="text" formControlName="name" placeholder="Wash & Laundry, Ironing & Pressing…" />
    </label>

    <label>
      Description
      <textarea formControlName="description" rows="2"></textarea>
    </label>

    <label>
      Display Order
      <input type="number" formControlName="displayOrder" min="0" />
    </label>

    @if (isEditMode()) {
      <label class="checkbox">
        <input type="checkbox" formControlName="isActive" />
        Active (visible to customers)
      </label>
    }

    <label>
      Icon / Image
      <input type="file" accept="image/*" (change)="onImageSelected($event)" />
    </label>

    @if (isUploading()) {
      <p>Uploading…</p>
    } @else if (iconOrImageUrl()) {
      <img [src]="iconOrImageUrl()" alt="Category preview" class="image-preview" />
    }

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <button type="button" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="isSaving()">
        {{ isSaving() ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</section>
